name: Test Docker setup with runtime-basedir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create runtime base directory
        run: mkdir -p /tmp/docker-runtime-basedir
      - id: setup-docker
        uses: .
        with:
          runtime-basedir: /tmp/docker-runtime-basedir
      - name: Assert Docker socket output is set
        env:
          SOCK: ${{ steps.setup-docker.outputs.sock }}
        run: |
          echo "sock: $SOCK"
          if [ -z "$SOCK" ]; then
            echo "FAIL: expected sock output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert Docker is functional with custom runtime basedir
        run: |
          docker version
          echo "PASS: docker version succeeded with custom runtime-basedir"
