name: Test daemon-config input is parsed (default context rejected)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
          context: default
      - name: Assert action failed on default context after parsing inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SOCK: ${{ steps.action.outputs.sock }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for 'default' context"
            exit 1
          fi
          if [ -n "$SOCK" ]; then
            echo "FAIL: sock output should be empty"
            exit 1
          fi
          echo "PASS"
