name: Test tcp-port input is parsed (default context rejected)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tcp-port: '2378'
          context: default
      - name: Assert action failed on default context without outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SOCK: ${{ steps.action.outputs.sock }}
          TCP: ${{ steps.action.outputs.tcp }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tcp: $TCP"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for 'default' context"
            exit 1
          fi
          if [ -n "$SOCK" ] || [ -n "$TCP" ]; then
            echo "FAIL: sock/tcp outputs should be empty"
            exit 1
          fi
          echo "PASS"
