name: Test Docker setup with channel input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-docker
        uses: .
        with:
          version: latest
          channel: stable
      - name: Assert Docker socket output is set
        env:
          SOCK: ${{ steps.setup-docker.outputs.sock }}
        run: |
          echo "sock: $SOCK"
          if [ -z "$SOCK" ]; then
            echo "FAIL: expected sock output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert Docker is functional
        run: |
          docker version
          echo "PASS: docker version succeeded"
