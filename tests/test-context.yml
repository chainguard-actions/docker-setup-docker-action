name: Test context input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          context: my-test-context
      - name: Assert sock output is set
        env:
          SOCK: ${{ steps.action.outputs.sock }}
        run: |
          echo "sock: $SOCK"
          if [ -z "$SOCK" ]; then
            echo "FAIL: expected sock output to be set"
            exit 1
          fi
          echo "PASS: sock output is set to '$SOCK'"
      - name: Assert Docker context exists
        run: |
          echo "Listing Docker contexts:"
          docker context ls
          if docker context ls --format '{{.Name}}' | grep -q 'my-test-context'; then
            echo "PASS: Docker context 'my-test-context' exists"
          else
            echo "FAIL: Docker context 'my-test-context' not found"
            exit 1
          fi
