name: Test Docker setup with TCP port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'latest'
          tcp-port: '2375'
        continue-on-error: true
      - name: Assert action ran (sock and tcp outputs set, or failed gracefully)
        env:
          SOCK: ${{ steps.action.outputs.sock }}
          TCP: ${{ steps.action.outputs.tcp }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sock: $SOCK"
          echo "tcp: $TCP"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SOCK" ]; then
              echo "FAIL: action succeeded but sock output is empty"
              exit 1
            fi
            if [ -z "$TCP" ]; then
              echo "FAIL: action succeeded but tcp output is empty when tcp-port=2375"
              exit 1
            fi
            if ! echo "$TCP" | grep -q "2375"; then
              echo "FAIL: expected tcp output to contain port 2375, got: $TCP"
              exit 1
            fi
            echo "PASS: sock=$SOCK tcp=$TCP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in act environment with limited capabilities)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
