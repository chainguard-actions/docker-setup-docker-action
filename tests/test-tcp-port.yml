name: Test Docker setup with tcp-port input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-docker
        uses: .
        with:
          tcp-port: "2375"
      - name: Assert Docker socket output is set
        env:
          SOCK: ${{ steps.setup-docker.outputs.sock }}
        run: |
          echo "sock: $SOCK"
          if [ -z "$SOCK" ]; then
            echo "FAIL: expected sock output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert Docker TCP output is set
        env:
          TCP: ${{ steps.setup-docker.outputs.tcp }}
        run: |
          echo "tcp: $TCP"
          if [ -z "$TCP" ]; then
            echo "FAIL: expected tcp output to be non-empty when tcp-port is set"
            exit 1
          fi
          echo "PASS: tcp output is '$TCP'"
      - name: Assert Docker is accessible via TCP
        run: |
          docker version
          echo "PASS: docker version succeeded"
