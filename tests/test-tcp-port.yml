name: Test Docker setup with TCP port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tcp-port: '2375'
          set-host: 'true'
        continue-on-error: true
      - name: Assert action completed (success or known limitation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SOCK: ${{ steps.action.outputs.sock }}
          TCP: ${{ steps.action.outputs.tcp }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "sock: $SOCK"
          echo "tcp: $TCP"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -n "$SOCK" ]; then
              echo "PASS: sock output is set to $SOCK"
            else
              echo "INFO: sock not set (Docker was already available)"
            fi
            if [ -n "$TCP" ]; then
              if echo "$TCP" | grep -q '2375'; then
                echo "PASS: tcp output contains port 2375: $TCP"
              else
                echo "FAIL: tcp output does not contain port 2375, got: $TCP"
                exit 1
              fi
            else
              echo "INFO: tcp output not set (Docker may not have been reinstalled)"
            fi
          else
            echo "INFO: Action did not succeed (likely Docker-in-Docker limitation in act)"
          fi
      - name: Assert Docker is available
        run: |
          echo "Docker version:"
          docker version
          if ! docker version > /dev/null 2>&1; then
            echo "FAIL: docker version command failed"
            exit 1
          fi
          echo "PASS: Docker is available"
      - name: Check TCP endpoint if action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TCP: ${{ steps.action.outputs.tcp }}
        run: |
          if [ "$OUTCOME" = "success" ] && [ -n "$TCP" ]; then
            echo "Testing Docker TCP endpoint: $TCP"
            if DOCKER_HOST="$TCP" docker version > /dev/null 2>&1; then
              echo "PASS: Docker is reachable via TCP at $TCP"
            else
              echo "INFO: Docker TCP endpoint not reachable (may be expected in act environment)"
            fi
          else
            echo "INFO: Skipping TCP check (action outcome: $OUTCOME, tcp: $TCP)"
          fi
          echo "PASS: TCP check step completed"
