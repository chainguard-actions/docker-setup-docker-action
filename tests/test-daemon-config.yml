name: Test Docker setup with daemon config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'latest'
          daemon-config: |
            {
              "log-level": "warn",
              "log-driver": "json-file"
            }
      - name: Assert docker socket output is set
        env:
          SOCK: ${{ steps.action.outputs.sock }}
        run: |
          echo "sock: $SOCK"
          if [ -z "$SOCK" ]; then
            echo "FAIL: expected sock output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert docker is running with config
        run: |
          docker info
          echo "PASS: docker daemon is running"
